<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aeirmist Desktop — Connection Notice</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: radial-gradient(circle at 20% 20%, rgba(0, 229, 255, 0.12), transparent 45%),
                    radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.12), transparent 45%),
                    #030712;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 36px 28px;
        text-align: center;
        backdrop-filter: blur(20px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }
      .badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(0, 229, 255, 0.12);
        border: 1px solid rgba(0, 229, 255, 0.25);
        color: #22d3ee;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }
      h1 { font-size: 24px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.02em; }
      p { color: rgba(248, 250, 252, 0.65); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 14px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, #06b6d4, #22d3ee);
        color: #030712;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      button:hover { opacity: 0.92; transform: translateY(-1px); }
      button:active { transform: translateY(0); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Aeirmist Desktop</div>
      <h1>Offline or Syncing</h1>
      <p>Unable to initialize the local Aeirmist bundle right now. Check your system connection or retry launching the workspace.</p>
      <button onclick="window.location.reload()">Retry Launch</button>
    </div>
  </body>
</html>
